<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#141c33"/>
    </linearGradient>
    <linearGradient id="scopeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00f5d4"/>
    </linearGradient>
    <linearGradient id="creepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#ff0055"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Badge -->
  <rect width="500" height="500" rx="100" fill="url(#bgGrad)"/>
  <rect width="492" height="492" x="4" y="4" rx="96" fill="none" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Radar Scope Reticle Perimeter -->
  <circle cx="250" cy="250" r="165" fill="none" stroke="url(#scopeGrad)" stroke-width="2" stroke-dasharray="10 14" stroke-opacity="0.4"/>
  <circle cx="250" cy="250" r="115" fill="#111a33" stroke="url(#scopeGrad)" stroke-width="4" filter="url(#glow)"/>

  <!-- Crosshair Reticle Hairlines -->
  <line x1="250" y1="90" x2="250" y2="160" stroke="#00f5d4" stroke-width="3" stroke-linecap="round"/>
  <line x1="250" y1="340" x2="250" y2="410" stroke="#00f5d4" stroke-width="3" stroke-linecap="round"/>
  <line x1="90" y1="250" x2="160" y2="250" stroke="#00f5d4" stroke-width="3" stroke-linecap="round"/>
  <line x1="340" y1="250" x2="410" y2="250" stroke="#00f5d4" stroke-width="3" stroke-linecap="round"/>

  <!-- PRD Locked Baseline Boundary (Inner Diamond) -->
  <polygon points="250,180 320,250 250,320 180,250" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-dasharray="4 4"/>

  <!-- Creeping Feature Tendril / Warning Anomaly Vector -->
  <path d="M 360 140 Q 300 200 260 235" fill="none" stroke="url(#creepGrad)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="360" cy="140" r="8" fill="#ff0055" filter="url(#glow)"/>
  <circle cx="310" cy="190" r="6" fill="#ffd166"/>

  <!-- Target Center Watchdog Core Eye -->
  <circle cx="250" cy="250" r="16" fill="#1b2548" stroke="#ff0055" stroke-width="3"/>
  <circle cx="250" cy="250" r="6" fill="#ffd166" filter="url(#glow)"/>
</svg>
